<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mehrle Survivor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js"
        integrity="sha384-hazsLVND17GNLVdtV19te6qbFT2YuLgl8SamcF+QR5eIOC+W4dGKrUNMxU1jH1zD" crossorigin="anonymous"></script>
<style>
/* ============================================================================
   MEHRLE SURVIVOR — "BROADCAST SCOREBOARD"
   A live-TV graphics package: near-black ground, one broadcast gold, condensed
   caps for every label, hard rectangular edges, solid team-color slabs, and
   tabular numerals sized like a score bug. No rounded corners anywhere.
   ========================================================================== */

:root{
  /* --- ground ------------------------------------------------------------ */
  --ink:#06080b;        /* page: near-black, the inside of a control truck */
  --panel:#0c1015;      /* card body */
  --panel2:#11171e;     /* inputs, insets */
  --chyron:#161e28;     /* the title bar strip on every card */
  --rule:#222c37;       /* hairline */
  --rule2:#3a4a5c;      /* bright hairline */
  --tx:#f3f6f9;
  --dim:#94a2b2;
  --dimmer:#6f7d8c;

  /* --- the single broadcast accent --------------------------------------- */
  --acc:#ffd400;        /* score-bug gold. ~15:1 on --ink */
  --acc-ink:#0a0800;    /* type that sits on the gold */
  --acc-d:#8a7200;

  --alive:#1ee07f;
  --out:#ff3b3b;
  --live:#ff2f2f;
  --venmo:#3d95ce;

  /* --- type ---------------------------------------------------------------
     iOS ships real condensed cuts under their PostScript names; Android has
     Roboto Condensed; Windows has Arial Narrow / Impact. If none resolve, the
     fallback is system sans at weight 800 with uppercase + tracking, which
     still reads as a deliberate chyron rather than an accident.            */
  --fdisp:"HelveticaNeue-CondensedBlack","Helvetica Neue Condensed Black","Roboto Condensed","Arial Narrow",Impact,Haettenschweiler,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fcond:"HelveticaNeue-CondensedBold","Helvetica Neue Condensed Bold","Roboto Condensed","Arial Narrow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fbody:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  /* legacy names: a few inline style="" attributes in the JS still read these */
  --bg:#06080b; --card:#0c1015; --card2:#11171e; --line:#222c37;
  --green:#1ee07f; --red:#ff3b3b; --amber:#ffd400; --blue:#ffd400;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--tx);
  font:16px/1.5 var(--fbody);
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}

/* one shared broadcast label recipe -------------------------------------- */
.fieldlabel,.gwhen,.tag,.bbtag,.st,.sub,.potline,footer,.sectionnav button,
.boardtools label,.boardtools select,.spin{
  font-family:var(--fcond);
  text-transform:uppercase;
  letter-spacing:.13em;
  font-weight:800;
}

/* ============================================================================
   1. HEADER — the network ident bar
   ========================================================================== */
header{
  display:flex;align-items:center;justify-content:space-between;
  background:#000;
  border-bottom:3px solid var(--acc);
  padding:calc(11px + env(safe-area-inset-top)) 12px 10px;
}
header h1{
  display:flex;align-items:center;min-width:0;flex:1;margin:0;padding-right:10px;
  font-family:var(--fdisp);font-weight:900;font-size:22px;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;color:#fff;
}
header h1::before{
  content:"";flex:none;width:6px;height:23px;background:var(--acc);margin-right:10px;
}
header h1 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .who,.who{
  flex:none;text-align:right;white-space:nowrap;padding-left:8px;
  font-family:var(--fcond);font-size:11px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
}
.who a{
  display:inline-block;padding:7px 0 7px 4px;
  color:var(--acc);text-decoration:none;border-bottom:1px solid rgba(255,212,0,.55);
}
.who a:active{background:var(--acc);color:var(--acc-ink)}

/* ============================================================================
   2. SECTION NAV — a pinned tab strip, hard rules, no gaps
   ========================================================================== */
.sectionnav{
  position:sticky;top:0;z-index:30;
  max-width:560px;margin:0 auto 14px;padding:0;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#000;border-bottom:1px solid var(--rule2);
}
.sectionnav button,.sectionnav .navbtn{
  min-height:46px;padding:0 4px;
  border:0;border-right:1px solid var(--rule);
  background:#000;color:var(--dim);
  font-size:12px;line-height:1;letter-spacing:.09em;cursor:pointer;
  -webkit-appearance:none;border-radius:0;
}
.sectionnav button:last-child{border-right:0}
.sectionnav button.on,.sectionnav .navbtn.on{background:var(--acc);color:var(--acc-ink)}
.sectionnav button:active{color:#fff}
.sectionnav button.on:active{color:var(--acc-ink);background:#fff}

main{max-width:560px;margin:0 auto;padding:0 12px 48px}

/* ============================================================================
   3. CARDS — rectangular panels with a chyron title strip
   ========================================================================== */
.card{
  background:var(--panel);
  border:1px solid var(--rule);
  border-radius:0;
  padding:14px;margin-bottom:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}
.card > h2{
  margin:0 -14px 14px;padding:11px 14px 10px;
  background:var(--chyron);
  border-bottom:1px solid var(--rule);
  box-shadow:inset 5px 0 0 var(--acc);
  font-family:var(--fcond);font-weight:800;font-size:14px;line-height:1.15;
  letter-spacing:.11em;text-transform:uppercase;color:#fff;
}
.card > h2:first-child{margin-top:-14px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}

/* ============================================================================
   4. STATUS BAND — the score bug. Biggest type on the screen.
   ========================================================================== */
.statusband{
  display:flex;justify-content:space-between;align-items:center;
  background:#000;border:1px solid var(--rule);
  border-left:9px solid var(--stat,var(--rule2));
  border-radius:0;padding:12px 14px;margin-bottom:14px;
  font-variant-numeric:tabular-nums;
}
.statusband.alive{--stat:var(--alive)}
.statusband.out{--stat:var(--out)}
.statusband > div{min-width:0}
.statusband > div:first-child{
  font-family:var(--fdisp);font-weight:900;font-size:30px;line-height:.95;
  letter-spacing:.01em;text-transform:uppercase;
  color:var(--stat,#fff);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.statusband > div + div{
  flex:none;padding-left:14px;
  font-family:var(--fdisp);font-weight:900;font-size:30px;line-height:.95;
  letter-spacing:0;color:var(--acc);white-space:nowrap;
}
.statusband .sub,.sub{
  display:block;margin-top:6px;
  font-family:var(--fcond);font-weight:800;font-size:11px;line-height:1.35;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  white-space:normal;
}
.statusband > div + div .sub{color:var(--dimmer)}

/* ============================================================================
   5. PICK CARD — banner, matchup strips, team slabs
   ========================================================================== */
.pickedbanner{
  background:#080b0f;border:1px solid var(--rule);border-left:6px solid var(--acc);
  border-radius:0;padding:11px 12px;margin-bottom:12px;
  font-size:14px;line-height:1.45;color:var(--dim);
}
.pickedbanner b{
  font-family:var(--fcond);font-weight:800;font-size:17px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--acc);
}

/* --- matchup strip ------------------------------------------------------- */
.game{
  margin-bottom:8px;border:1px solid var(--rule);border-radius:0;
  background:#090c11;overflow:hidden;
}
.game .gwhen{
  display:flex;align-items:center;
  padding:6px 10px;font-size:10.5px;line-height:1.2;
  color:var(--dim);background:#000;border-bottom:1px solid var(--rule);
}
.game .gwhen .dot{width:6px;height:6px;background:currentColor;flex:none;margin-right:8px}
.game.islive .gwhen{background:var(--live);color:#fff;border-bottom-color:var(--live)}
.game.islive .gwhen .dot{background:#fff;animation:blip 1.05s steps(1,end) infinite}
@keyframes blip{0%,55%{opacity:1}56%,100%{opacity:.15}}

.game .grow{display:flex;align-items:stretch}

/* the "@" is a divider rail, not a word */
.game .at{
  flex:none;align-self:stretch;display:flex;align-items:center;justify-content:center;
  width:26px;background:#000;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  font-family:var(--fcond);font-weight:800;font-size:10px;letter-spacing:.06em;
  color:#57646f;padding:0;
}

/* --- team button: solid team-colour slab + name on black ----------------- */
button.team{
  flex:1;min-width:0;position:relative;overflow:hidden;
  display:flex;align-items:center;
  background:#0a0e13;border:0;border-radius:0;color:var(--tx);
  padding:0;min-height:60px;cursor:pointer;text-align:left;
  font-family:var(--fcond);font-weight:800;font-size:15.5px;letter-spacing:.03em;
  text-transform:uppercase;
}
/* full-bleed colour, off by default — the colour earns its place as a block,
   not as a wash. It only floods in on press / selection. */
button.team::before{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;
  background:var(--tc,#4a5462);opacity:0;transition:opacity .1s linear;
}
/* the weight-bearing bar */
button.team::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:var(--tc,#4a5462);
}
button.team:active::before{opacity:.26}

button.team .logo{
  position:relative;flex:none;align-self:stretch;width:54px;
  display:flex;align-items:center;justify-content:center;
  background:var(--tc,#4a5462);border-radius:0;overflow:hidden;padding:8px;
  box-shadow:inset -1px 0 0 rgba(0,0,0,.35);
}
button.team .logo img{width:100%;height:100%;object-fit:contain;display:block}
button.team .logo .abbr{
  font-family:var(--fcond);font-weight:800;font-size:12px;letter-spacing:.02em;
  color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.9),0 0 7px rgba(0,0,0,.85);
}
button.team .nm{
  position:relative;flex:1 1 auto;min-width:0;padding:0 8px 0 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;
}
/* corner flag: absolutely placed so it can never squeeze the team name */
button.team .tag{
  position:absolute;top:0;right:0;z-index:2;
  font-family:var(--fcond);font-weight:800;font-size:8.5px;letter-spacing:.1em;
  color:var(--dimmer);background:#000;border:0;border-left:1px solid var(--rule2);
  border-bottom:1px solid var(--rule2);border-radius:0;padding:3px 5px 3px 6px;
}

/* home side mirrors, like a real scoreboard */
.game .grow > button.team:last-child{flex-direction:row-reverse;text-align:right}
.game .grow > button.team:last-child .nm{padding:0 10px 0 8px}
.game .grow > button.team:last-child .logo{box-shadow:inset 1px 0 0 rgba(0,0,0,.35)}
.game .grow > button.team:last-child .tag{
  right:auto;left:0;border-left:0;border-right:1px solid var(--rule2);padding:3px 6px 3px 5px;
}

/* states --------------------------------------------------------------- */
button.team.mypick{box-shadow:inset 0 0 0 2px #fff}
button.team.mypick .tag{color:#0a0e13;background:#fff;border-color:#fff}
button.team.sel{color:#fff;box-shadow:inset 0 0 0 3px var(--acc);z-index:1}
button.team.sel::before{opacity:.32}
button.team.sel::after{height:7px;background:var(--acc)}
button.team.sel .tag{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}

button.team.used,button.team.locked{cursor:not-allowed}
button.team.used .nm,button.team.locked .nm{color:#5d6874}
button.team.used .nm{text-decoration:line-through;text-decoration-thickness:2px}
button.team.used .logo,button.team.locked .logo{-webkit-filter:grayscale(1) brightness(.42);filter:grayscale(1) brightness(.42)}
button.team.used::after,button.team.locked::after{background:#2c343e}
button.team.locked::before{background:#000;opacity:.35}

/* --- submit bar: a sticky action slab ------------------------------------ */
.submitbar{
  position:sticky;bottom:0;z-index:5;
  margin:14px -14px 2px;padding:14px 14px 12px;
  background:linear-gradient(rgba(12,16,21,0),rgba(12,16,21,.92) 38%,var(--panel) 62%);
}

/* ============================================================================
   6. BUTTONS
   ========================================================================== */
button.big{
  display:block;width:100%;min-height:54px;padding:15px 14px;
  background:var(--acc);color:var(--acc-ink);
  border:0;border-radius:0;-webkit-appearance:none;cursor:pointer;
  font-family:var(--fcond);font-weight:800;font-size:17px;line-height:1.15;
  letter-spacing:.1em;text-transform:uppercase;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);
}
button.big:active{background:#fff}
button.big:disabled{
  background:transparent;color:#6b7887;
  border:1px dashed var(--rule2);box-shadow:none;cursor:default;
  letter-spacing:.09em;font-size:14px;
}
button.big.sec{
  background:transparent;color:var(--tx);
  border:1px solid var(--rule2);box-shadow:none;
}
button.big.sec:active{background:var(--rule);color:#fff}
.mini{
  width:auto!important;min-height:40px!important;
  padding:10px 14px!important;font-size:12px!important;letter-spacing:.12em!important;
}

/* ============================================================================
   7. CLAIM / ROSTER LIST
   ========================================================================== */
#nameList{border-top:1px solid var(--rule);margin-top:4px}
.namebtn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;min-height:52px;margin:0;padding:12px 4px 12px 12px;
  text-align:left;background:#090d12;color:var(--tx);
  border:0;border-bottom:1px solid var(--rule);border-left:4px solid var(--rule2);
  border-radius:0;-webkit-appearance:none;cursor:pointer;
  font-family:var(--fcond);font-weight:800;font-size:16px;letter-spacing:.03em;
  text-transform:uppercase;
}
.namebtn:active{border-left-color:var(--acc);background:#0f151c}
.namebtn.taken{color:#5d6874;border-left-color:#2c343e;background:#070a0e}
.namebtn .tag{
  float:none;flex:none;margin-left:10px;
  font-family:var(--fcond);font-weight:800;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dimmer);
  border:1px solid var(--rule2);padding:4px 6px;
}
.namebtn .tag:empty{display:none}

/* ============================================================================
   8. FORMS
   ========================================================================== */
.fieldlabel{
  display:block;margin:14px 0 6px;
  font-size:10.5px;color:var(--acc);
}
input[type=text],input[type=email],input[type=tel]{
  width:100%;background:var(--panel2);color:var(--tx);
  border:1px solid var(--rule2);border-radius:0;-webkit-appearance:none;
  padding:14px 12px;font-size:16px;font-family:var(--fbody);margin-bottom:10px;
  min-height:50px;
}
input[type=text]::-webkit-input-placeholder,
input[type=email]::-webkit-input-placeholder,
input[type=tel]::-webkit-input-placeholder{color:#5d6874}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{
  outline:0;border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:#0a0e13;
}
.paybox{
  background:#080b0f;border:1px solid var(--rule);border-left:6px solid var(--acc);
  border-radius:0;padding:14px;margin:16px 0;
}
.paybox > b{
  display:block;margin-bottom:4px;
  font-family:var(--fdisp);font-weight:900;font-size:21px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--acc);font-variant-numeric:tabular-nums;
}
.venmo{
  display:block;text-align:center;text-decoration:none;
  background:var(--venmo);color:#fff;border-radius:0;
  padding:16px 12px;margin:12px 0;min-height:52px;
  font-family:var(--fcond);font-weight:800;font-size:15px;
  letter-spacing:.1em;text-transform:uppercase;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28);
}
.venmo:active{background:#2f7cae}
.checkrow{
  display:flex;align-items:flex-start;margin:14px 0 0;
  font-size:14px;line-height:1.45;color:var(--dim);
}
.checkrow input{
  width:24px;height:24px;flex:none;margin:1px 11px 0 0;
  accent-color:var(--acc);
}
.checkrow b{color:var(--tx);font-weight:700}

/* ============================================================================
   9. LEAGUE PICK BOARD
   ========================================================================== */
.boardtools{display:flex;align-items:center;margin:14px 0 4px}
.boardtools label{
  margin-left:auto;margin-right:9px;font-size:10.5px;color:var(--dimmer);
}
.boardtools select{
  margin-left:0;min-height:40px;padding:9px 28px 9px 10px;
  background-color:var(--panel2);color:var(--tx);
  border:1px solid var(--rule2);border-radius:0;-webkit-appearance:none;appearance:none;
  font-size:11.5px;
  background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),
                   linear-gradient(135deg,var(--acc) 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.boardrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule);
}
.boardrow:last-child{border-bottom:none}
.boardrow .player{
  font-family:var(--fcond);font-weight:800;font-size:16px;letter-spacing:.03em;
  text-transform:uppercase;color:var(--tx);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.boardrow .player .muted{
  font-family:var(--fcond);font-size:10px;letter-spacing:.12em;color:var(--dimmer);
}
.boardrow .pick{
  flex:none;text-align:right;padding-left:12px;
  font-family:var(--fcond);font-weight:800;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#69767f;
}
.boardrow .pick.live{
  color:var(--acc-ink);background:var(--acc);padding:5px 8px;font-size:12px;
}

/* ============================================================================
   10. SEASON HISTORY — a results ledger
   ========================================================================== */
.hist{display:block}
.hist span{
  display:flex;align-items:center;width:100%;margin:0 0 6px;min-height:38px;
  background:#090d12;border:1px solid var(--rule);border-left:4px solid var(--rule2);
  border-radius:0;padding:0;overflow:hidden;
  font-family:var(--fcond);font-weight:800;font-size:12.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tx);
}
.hist .logo{
  flex:none;width:34px;align-self:stretch;position:relative;border-radius:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--tc,#4a5462);overflow:hidden;padding:4px;
}
.hist .logo img{width:100%;height:100%;object-fit:contain;display:block}
.hist .logo .abbr{
  font-size:8.5px;font-weight:800;color:#fff;
  text-shadow:0 1px 0 rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.85);
}
.hist span b{
  flex:none;margin:0 8px 0 9px;font-weight:800;color:var(--acc);opacity:1;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.hist span.W{border-left-color:var(--alive)}
.hist span.L,.hist span.T,.hist span.MISS{border-left-color:var(--out)}
/* the result stamp, flush right like a box score */
.hist span.W::after,.hist span.L::after,.hist span.T::after,.hist span.MISS::after{
  display:flex;align-items:center;align-self:stretch;justify-content:center;
  margin-left:auto;padding:0 10px;min-width:46px;
  font-size:11.5px;letter-spacing:.12em;color:var(--acc-ink);
}
.hist span.W::after{content:"W";background:var(--alive)}
.hist span.L::after{content:"L";background:var(--out);color:#fff}
.hist span.T::after{content:"T";background:var(--out);color:#fff}
.hist span.MISS::after{content:"No pick";background:var(--out);color:#fff}
.hist span.W,.hist span.L,.hist span.T,.hist span.MISS{padding-right:0}

/* ============================================================================
   11. LEAGUE PANEL — pot line, standings
   ========================================================================== */
.potline{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:8px 0;font-size:11px;color:var(--dim);
  border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums;
}
.potline b{
  font-family:var(--fdisp);font-weight:900;font-size:32px;line-height:1;
  letter-spacing:0;text-transform:none;color:var(--acc);
}
.potline.muted{font-size:10.5px;color:var(--dimmer);border-bottom:none}
.count{
  font-variant-numeric:tabular-nums;color:var(--alive);
  font-family:var(--fcond);font-weight:800;letter-spacing:.12em;
}
.standrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px;
}
.standrow:last-child{border-bottom:none}
.standrow > span:first-child{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--fcond);font-weight:800;letter-spacing:.03em;text-transform:uppercase;
}
.standrow .st{
  flex:none;margin-left:12px;padding:4px 7px;font-size:10px;line-height:1;
}
.standrow .st.alive{background:var(--alive);color:var(--acc-ink)}
.standrow .st.out{background:transparent;color:var(--dimmer);border:1px solid var(--rule2)}

/* ============================================================================
   12. BUYBACK — the money title card
   ========================================================================== */
.card.buyback{
  border-color:var(--acc-d);
  background:var(--panel);
}
.buyback .bbhead{
  text-align:center;margin:-14px -14px 16px;padding:22px 14px 20px;

"use strict";

const TEAM_NAMES = {ARI:'Cardinals',ATL:'Falcons',BAL:'Ravens',BUF:'Bills',CAR:'Panthers',CHI:'Bears',
CIN:'Bengals',CLE:'Browns',DAL:'Cowboys',DEN:'Broncos',DET:'Lions',GB:'Packers',HOU:'Texans',IND:'Colts',
JAX:'Jaguars',KC:'Chiefs',LV:'Raiders',LAC:'Chargers',LAR:'Rams',MIA:'Dolphins',MIN:'Vikings',NE:'Patriots',
NO:'Saints',NYG:'Giants',NYJ:'Jets',PHI:'Eagles',PIT:'Steelers',SF:'49ers',SEA:'Seahawks',TB:'Buccaneers',

// Official club colours (ESPN team API, fetched 2026-08-07). A few clubs are

// Logos are a progressive enhancement: the coloured badge with the abbreviation is
// painted first and the crest sits on top only if it loads, so an offline phone or a

function teamLogo(abbr){
  const c = TEAM_COLORS[abbr] || '#444';
  return '<span class="logo" style="--tc:' + c + ';--tink:' + teamInk(c) + ';--tslab:' + slabFor(c) + '">'
    + '<span class="abbr">' + esc(abbr) + '</span>'

    + ' onload="this.previousElementSibling.style.display=\'none\'"'
    + ' onerror="this.remove()"></span>';

// Relative luminance (WCAG). Drives two things: the ink used on a team's colour
// slab, and whether that slab needs lightening so a dark crest is not lost on it.
function lum(hex){
  const h = String(hex).replace('#','');
  const v = [0,2,4].map(i => {
    const c = parseInt(h.substr(i,2),16)/255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
}
// Pick the ink by MEASURED contrast rather than a luminance guess: a fixed
// threshold gave white on CIN/CLE/DEN orange at ~3.4:1. Try both inks, take the
// better one. This is the fallback badge — it is exactly what shows when the
// logo CDN is slow or blocked, so it has to be readable for all 32 clubs.
function contrast(a, b){
  const hi = Math.max(a, b), lo = Math.min(a, b);
  return (hi + 0.05) / (lo + 0.05);
}
function teamInk(hex){
  const bg = lum(slabFor(hex));
  return contrast(lum('#ffffff'), bg) >= contrast(lum('#0a0d10'), bg) ? '#ffffff' : '#0a0d10';
}
// A near-black club colour (DAL/BAL/CHI/NE navy) swallows its own dark crest, so
// lift the slab toward a readable grey. Solid, not rgba, so what we measure is
// what renders.
function slabFor(hex){
  if (lum(hex) >= 0.05) return hex;
  const h = String(hex).replace('#','');
  const mix = i => Math.round(parseInt(h.substr(i,2),16) * 0.45 + 255 * 0.22);
  return '#' + [0,2,4].map(i => mix(i).toString(16).padStart(2,'0')).join('');
}

function isAnonymousSession(s){ return !!(s && s.user && (s.user.is_anonymous === true || !s.user.email)); }

async function loadBootstrap(){

async function prepareSession(){

}

async function loadPickBoard(){
  db.board = []; db.boardWeek = null;
  if (!session) return;
  const { data, error } = await sb.rpc('get_pick_board', {p_week:null});
  if (error) throw error;
  db.board = Array.isArray(data) ? data : [];
  db.boardWeek = db.board.length ? db.board[0].board_week : null;
}

async function submitSignupRequest(name, email, phone, venmoSent){
  name = String(name || '').trim();
  email = String(email || '').trim().toLowerCase();
  phone = String(phone || '').trim();
  if (name.length < 2) throw new Error('Enter your full name.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Enter a valid email address.');
  if (phone.replace(/\D/g, '').length < 10) throw new Error('Enter a valid mobile number.');
  if (!venmoSent) throw new Error('Confirm that you sent the Venmo entry fee.');
  signupState.form = {name, email, phone};
  signupState.busy = true; signupState.message = ''; render();
  if (DEMO){
    signupState = {busy:false, done:true, email, message:'', form:{name:'',email:'',phone:''}}; render(); return;
  }
  let temporarySession = false;
  if (!session){
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) throw error;
    session = data.session; temporarySession = true;
  }
  const { error } = await sb.rpc('submit_signup_request', {
    p_name:name, p_email:email, p_phone:phone, p_venmo_sent:true, p_client_token:getSignupToken()
  });
  if (error){
    if (temporarySession){ try{ await sb.auth.signOut(); }catch(e){} session = null; }
    throw error;
  }
  signupState = {busy:false, done:true, email, message:'', form:{name:'',email:'',phone:''}};
  if (temporarySession){ try{ await sb.auth.signOut(); }catch(e){} session = null; }
  render();
}

async function loadAll(){
  let mapped = null;
  if (authMode === 'email_otp'){
    if (!session || isAnonymousSession(session)) throw new Error('Please sign in with your email code.');
    const mine = await sb.rpc('get_my_player');
    if (mine.error) throw mine.error;
    mapped = Array.isArray(mine.data) ? mine.data[0] : mine.data;
    if (!mapped || !mapped.pid) throw new Error('This signed-in email is not linked to an active pool account. Ask Noah to check the roster email.');
    me.pid = mapped.pid;
  }
  const playerColumns = authMode === 'email_otp'
    ? 'pid,name,alive,elim_week,used_teams'
    : 'pid,name,claim_uid,alive,elim_week,used_teams';
  const [lg, pl, wk] = await Promise.all([
    sb.from('league').select('config,state,updated_at').eq('id', 1).maybeSingle(),
    sb.from('players').select(playerColumns).order('name'),
    sb.from('weeks').select('week,kicks,games,first_kickoff').order('week'),
  ]);
  if (lg.error || pl.error || wk.error) throw (lg.error || pl.error || wk.error);
  db.league = lg.data || {config:{}, state:{}};
  db.players = pl.data || [];
  // pick week = first published week that still has a game in the future
  const now = Date.now();
  db.week = null;
  for (const w of (wk.data || [])){
    const kicks = w.kicks || {};
    if (Object.values(kicks).some(iso => new Date(iso).getTime() > now)){ db.week = w; break; }
  }
  me.player = me.pid ? db.players.find(p => p.pid === me.pid) : null;
  // device thinks it's someone, but the claim was reset or belongs to another uid -> back to claim
  if (authMode !== 'email_otp' && me.player && me.player.claim_uid && session && me.player.claim_uid !== session.user.id){
    me.player = null; me.pid = null; localStorage.removeItem('survivor_pid');
  }
  db.myPick = null;
  if (me.player && db.week){
    const { data, error } = await sb.from('picks').select('id,team,week,submitted_at')
      .eq('pid', me.pid).eq('week', db.week.week).maybeSingle();
    if (error) throw error;
    db.myPick = data || null;
  }
  await loadPickBoard();
}

async function sendLoginCode(email){
  email = String(email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Enter a valid email address.');
  loginState.email = email;
  loginState.busy = true; loginState.message = ''; render();
  if (session){ await sb.auth.signOut(); session = null; }
  const { error } = await sb.auth.signInWithOtp({email, options:{shouldCreateUser:false}});
  loginState.busy = false;
  if (error) throw error;
  loginState.email = email; loginState.sent = true;
  sessionStorage.setItem('survivor_login_email', email);
  render();
}

async function verifyLoginCode(code){
  code = String(code || '').replace(/\D/g, '');
  if (!/^\d{6}$/.test(code)) throw new Error('Enter the 6-digit code from the email.');
  loginState.busy = true; loginState.message = ''; render();
  const { data, error } = await sb.auth.verifyOtp({email:loginState.email, token:code, type:'email'});
  if (error){ loginState.busy = false; throw error; }
  session = data.session;
  loginState = {email:'',sent:false,busy:false,message:''};
  sessionStorage.removeItem('survivor_login_email');
  await loadAll(); render();
}

async function signOutPlayer(){
  await sb.auth.signOut();
  session = null; me.pid = null; me.player = null; db.players = []; db.week = null; db.myPick = null;
  localStorage.removeItem('survivor_pid'); sessionStorage.removeItem('survivor_login_email');
  loginState = {email:'',sent:false,busy:false,message:''};
  await loadBootstrap();
  if (authMode !== 'email_otp') await prepareSession();
  render();
}

async function claim(pid){
  const { data, error } = await sb.rpc('claim_player', { p_pid: pid });
  if (error){ toast('Claim failed: ' + error.message); return; }
  if (data !== true){
    toast('That name is already claimed on another phone. If it’s really you, ask Noah to reset it.');
    return;
  }
  me.pid = pid; localStorage.setItem('survivor_pid', pid);
  view = 'home';
  await loadAll(); render();
  toast('Welcome, ' + (me.player ? me.player.name : pid) + '!');
}

async function submitPick(){
  if (!sel || !me.player || !db.week) return;
  const requested = sel;
  const wk = db.week.week;
  const id = me.pid + '_w' + wk;
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = true;
  let error = null;
  if (db.myPick){
    ({ error } = await sb.from('picks').update({ team: sel }).eq('id', id));
  } else {
    ({ error } = await sb.from('picks').insert({ id, pid: me.pid, week: wk, team: sel }));
    if (error && (error.code === '23505')){ // raced our own earlier insert
      ({ error } = await sb.from('picks').update({ team: sel }).eq('id', id));
    }
  }
  if (error){
    const msg = /row-level security/i.test(error.message)
      ? 'The league server refused this pick — the game may have kicked off, or you’ve already used that team.'
      : error.message;
    toast('❌ ' + msg);
    await loadAll(); render();
    return;
  }
  await loadAll();
  if (!db.myPick || db.myPick.team !== requested){
    sel = null;
    render();
    toast('❌ Pick was not changed — your original game may already have kicked off.');
    return;
  }
  sel = null;
  render();
  toast('Locked in: ' + (TEAM_NAMES[db.myPick.team] || db.myPick.team) + ' — you can change it until kickoff');
}

// ================= demo mode =================
// ?demo=1 is the default (alive, hasn't picked). The other scenarios exist because
// those are the screens that are hard to reason about in the abstract and impossible
// to see in the real app until they happen to a real person mid-season:
//   ?demo=picked  already locked a pick in
//   ?demo=out     eliminated, one buyback offered
//   ?demo=used    eliminated, buyback already spent — final
//   ?demo=new     this phone has never claimed a name
function loadDemo(){
  const t = h => new Date(Date.now() + h * 3600e3).toISOString();
  const scenario = (new URLSearchParams(location.search).get('demo') || '1').toLowerCase();
  const out = scenario === 'out', used = scenario === 'used';
  const dead = out || used;
  const me_state = {name:'Demo You', alive:!dead, picks:{1:{team:'DEN', outcome:'W'}, 2:{team:'ARI', outcome:dead ? 'L' : 'W'}}};
  if (dead){
    me_state.elimWeek = 2;
    me_state.buybackUsed = used;
    me_state.buybackEligible = out;
    me_state.buybackPrice = out ? 30 : null;
    me_state.buybackReentryWeek = out ? 3 : null;
  }
  db.league = {config:{leagueName:'Mehrle Survivor (DEMO)', seasonYear:2026, entryFee:10},
    state:{pot:{entry:700, bb: out || used ? 30 : 0, total: out || used ? 730 : 700},
      aliveCount: dead ? 2 : 3, lastApplied:2,
      recap:'🏈 Demo recap — week 2 results…',
      players:{demo_you: me_state}}};
  db.players = [
    {pid:'demo_you', name:'Demo You', claim_uid:'me', alive:!dead, elim_week: dead ? 2 : null, used_teams:['DEN','ARI']},
    {pid:'demo_amy', name:'Amy (demo)', claim_uid:null, alive:true, used_teams:[]},
    {pid:'demo_joe', name:'Joe (demo)', claim_uid:null, alive:false, elim_week:2, used_teams:[]},
  ];
  db.week = {week:3, first_kickoff:t(2),
    games:[['CIN','CLE',t(2)],['DEN','KC',t(5)],['DAL','PHI',t(-1)],['BUF','MIA',t(26)]],
    kicks:{CIN:t(2), CLE:t(2), DEN:t(5), KC:t(5), DAL:t(-1), PHI:t(-1), BUF:t(26), MIA:t(26)}};
  if (scenario === 'new'){
    // never-claimed phone: this is the very first thing a real player sees
    me.pid = null; me.player = null;
    db.players[0].claim_uid = null;
  } else {
    me.pid = 'demo_you'; me.player = db.players[0];
  }
  db.myPick = scenario === 'picked' ? {team:'CIN', week:3} : null;
  db.boardWeek = 3;
  db.board = [
    {board_week:3,pid:'demo_you',player_name:'Demo You',alive:!dead,elim_week: dead ? 2 : null,
     team: scenario === 'picked' ? 'CIN' : null, pick_status: dead ? 'out' : 'hidden', is_self:true},
    {board_week:3,pid:'demo_amy',player_name:'Amy (demo)',alive:true,team:'DAL',pick_status:'revealed',is_self:false},
    {board_week:3,pid:'demo_joe',player_name:'Joe (demo)',alive:false,elim_week:2,team:null,pick_status:'out',is_self:false},
  ];
  // graded history for the others so the season run has something to draw
  db.league.state.players.demo_amy = {name:'Amy (demo)', alive:true,
    picks:{1:{team:'BUF', outcome:'W'}, 2:{team:'SF', outcome:'W'}}};
  db.league.state.players.demo_joe = {name:'Joe (demo)', alive:false, elimWeek:2,
    picks:{1:{team:'KC', outcome:'W'}, 2:{team:'NYJ', outcome:'L'}}};
  session = {user:{id:'me'}};
  if (!requestedScreen) view = 'home';
}

// ================= render =================
function render(){
  const app = document.getElementById('app');
  const cfg = (db.league && db.league.config) || {};
  document.getElementById('hName').textContent = cfg.leagueName || 'Mehrle Survivor';
  document.title = cfg.leagueName || 'Mehrle Survivor';
  const who = document.getElementById('hWho');
  who.innerHTML = me.player ? esc(me.player.name) + ' · <a href="#" id="' + (authMode === 'email_otp' ? 'signOutLink' : 'switchLink') + '">'
    + (authMode === 'email_otp' ? 'sign out' : 'switch') + '</a>' : '';
  document.getElementById('foot').textContent = DEMO ? 'DEMO MODE — nothing is saved' :
    'Picks lock at each game’s kickoff. Problems? Text Noah.';

  renderSectionNav();
  if (view === 'join'){ app.innerHTML = renderSignup(); wire(); return; }
  if (view === 'board'){ app.innerHTML = renderPickBoard(); wire(); return; }

  if (!me.player){ app.innerHTML = authMode === 'email_otp' ? renderLogin() : renderClaim(); wire(); return; }

  let h = '';
  const st = (db.league && db.league.state) || {};
  const meState = (st.players || {})[me.pid] || {};
  const alive = me.player.alive;
  let outSub = 'Your entry is eliminated.';
  if (!alive && meState.buybackEligible){
    outSub = 'But you get one buyback \u2014 see below.';
  } else if (!alive && meState.buybackUsed){
    outSub = 'Your one buyback was already used, so this loss is final.';
  } else if (!alive && me.player.elim_week > 5){
    outSub = 'Buybacks are only available after losses in Weeks 1–5.';
  }
  h += '<div class="statusband ' + (alive ? 'alive' : 'out') + '"><div>' +
    (alive ? 'Alive' : 'Out' + (me.player.elim_week ? ' — week ' + me.player.elim_week : '')) +
    '<div class="sub">' + (alive
      ? esc((st.aliveCount != null ? st.aliveCount + ' of ' + db.players.length + ' still standing' : ''))
      : esc(outSub)) + '</div></div>' +
    (st.pot ? '<div style="text-align:right">' + money(st.pot.total) + '<div class="sub">pot</div></div>' : '') + '</div>';

  if (alive) h += renderPickCard();
  else if (meState.buybackEligible) h += renderBuyback(meState);
  h += renderHistory(meState);
  h += renderLeague(st);
  app.innerHTML = h;
  wire();
}

function seasonRun(pubRow, boardRow){
  const picks = (pubRow && pubRow.picks) || {};
  const weeks = Object.keys(picks).map(Number).sort(function(a,b){ return a - b; });
  if (!weeks.length) return '';
  let wins = 0, chips = '';
  for (const w of weeks){
    const p = picks[w] || {};
    const o = p.outcome || '';
    if (o === 'W') wins++;
    chips += '<span class="runchip ' + esc(o) + '" title="Week ' + w + ' — '
      + esc(TEAM_NAMES[p.team] || p.team || 'no pick') + (o ? ' (' + esc(o) + ')' : '') + '">'
      + (p.team ? teamLogo(p.team) : '<span class="logo" style="--tc:#39434f;--tink:#fff;--tslab:#39434f"><span class="abbr">—</span></span>')
      + '<b>' + w + '</b></span>';
  }
  const rec = wins + '-' + (weeks.length - wins);
  return '<div class="runrow"><span class="runrec">' + esc(rec) + '</span>'
    + '<span class="run">' + chips + '</span></div>';
}

function renderPickBoard(){
  if (!me.player){
    return '<div class="card"><h2>Everyone</h2><p class="muted">Members only — claim your name first.</p>'
      + '<button type="button" class="big sec" id="goMyPick">Go to My Pick</button></div>';
  }
  if (!db.board.length){
    return '<div class="card"><h2>League picks</h2><p class="muted">There isn’t a published pick week yet. Check back after Noah publishes the schedule.</p>'
      + '<button type="button" class="big sec mini" id="boardRefresh">Refresh</button></div>';
  }
  const rows = db.board.slice().sort((a,b) => {
    if (boardSort === 'team'){
      const at = a.team ? (TEAM_NAMES[a.team] || a.team) : 'zzzz';
      const bt = b.team ? (TEAM_NAMES[b.team] || b.team) : 'zzzz';
      const byTeam = at.localeCompare(bt);
      if (byTeam) return byTeam;
    }
    return String(a.player_name || '').localeCompare(String(b.player_name || ''));
  });
  let h = '<div class="card"><h2>Week ' + esc(db.boardWeek) + ' — everyone</h2>'
    + '<p class="muted">Picks show once that team’s game starts.</p>'
    + '<div class="boardtools"><button type="button" class="big sec mini" id="boardRefresh">Refresh</button>'
    + '<label class="muted" for="boardSort">Sort</label><select id="boardSort"><option value="player"' + (boardSort === 'player' ? ' selected' : '') + '>Player</option>'
    + '<option value="team"' + (boardSort === 'team' ? ' selected' : '') + '>Revealed team</option></select></div>';
  const pub = ((db.league && db.league.state && db.league.state.players) || {});
  for (const r of rows){
    let pick = 'Hidden until kickoff', cls = '';
    const ownCurrentPick = r.is_self && db.week && db.week.week === r.board_week && db.myPick;
    if (r.pick_status === 'revealed' && r.team){ pick = (TEAM_NAMES[r.team] || r.team) + ' (' + r.team + ')'; cls = ' live'; }
    else if (ownCurrentPick){ pick = 'Your pick: ' + (TEAM_NAMES[db.myPick.team] || db.myPick.team); cls = ' live'; }
    else if (r.pick_status === 'missing') pick = 'No pick';
    else if (r.pick_status === 'out') pick = 'Out' + (r.elim_week ? ' — week ' + r.elim_week : '');
    h += '<div class="boardrow"><span class="player">' + esc(r.player_name) + (r.is_self ? ' <span class="muted">(you)</span>' : '') + '</span>'
      + '<span class="pick' + cls + '">' + esc(pick) + '</span></div>'
      + seasonRun(pub[r.pid], r);
  }
  return h + '</div>';
}

// The buyback is the one screen that asks a person for money, and it used to be a
// grey subtitle inside the red band. It gets the same treatment as the entry fee.
function renderBuyback(meState){
  const price = money(meState.buybackPrice);
  const wk = meState.buybackReentryWeek;
  const used = (me.player.used_teams || []).map(t => TEAM_NAMES[t] || t);
  return '<div class="card buyback">'
    + '<div class="bbhead"><span class="bbtag">Second chance</span>'

      + '<p class="muted">You’re back in for <b>Week ' + wk + '</b> — everyone else keeps playing without you until then.</p></div>'

    + '<p class="muted" style="text-align:center;margin:-2px 0 14px">Name in the note, then text Noah.</p>'
    + '<ul class="bbrules">'
      + '<li><b>One buyback per season</b> — lose again and you’re done.</li>'
      + '<li>Price goes up ' + '$10 every week you wait.</li>'
      + '<li>' + (used.length ? '<b>' + esc(used.join(', ')) + '</b> stay' + (used.length>1?'':'s') + ' used.' : 'Teams you used stay used.') + '</li>'
    + '</ul>'
    + '<p class="muted">Or do nothing — you can still watch everyone else.</p>'
    + '</div>';
}

function renderPickCard(){
  if (!db.week){
    return '<div class="card"><h2>This week</h2><p class="muted">No week is open for picks yet — Noah publishes the schedule after grading. Check back soon.</p></div>';
  }
  const wk = db.week, now = Date.now();
  const used = new Set(me.player.used_teams || []);
  const pickKicked = !!(db.myPick && wk.kicks[db.myPick.team] && new Date(wk.kicks[db.myPick.team]).getTime() <= now);
  let h = '<div class="card">';
  if (db.myPick){
    // The confirmed state is the whole point of opening the app. Make it a monument:
    // crest, team, and exactly when the door closes — not a grey sentence.
    const myKick = wk.kicks[db.myPick.team];
    const _c = TEAM_COLORS[db.myPick.team] || '#444';
    h += '<div class="youin" style="--tc:' + _c + ';--tink:' + teamInk(_c) + ';--tslab:' + slabFor(_c) + '">'
      + teamLogo(db.myPick.team)
      + '<div class="yitxt"><span class="yi1">Week ' + wk.week + ' — you\'re in</span>'
      + '<span class="yi2">' + esc(TEAM_NAMES[db.myPick.team] || db.myPick.team) + '</span>'
      + '<span class="yi3">' + (pickKicked ? 'Locked — your game started'
          : (myKick ? 'You can change it until ' + esc(fmtKick(myKick)) : 'You can change it until kickoff')) + '</span></div>'
      + '<span class="yiok">✓</span></div>';
  } else {
    h += '<h2 class="bigq">Week ' + wk.week + ': who wins?</h2>'
      + '<p class="deadline">Tap one team below. Pick before the games start or you\'re out.</p>';
  }
  const games = (wk.games && wk.games.length) ? wk.games : Object.keys(wk.kicks || {}).sort().map(t => [t, null, wk.kicks[t]]);
  for (const g of games){
    const [away, home, iso] = g;
    const kicked = new Date(iso).getTime() <= now;
    h += '<div class="game' + (kicked ? ' islive' : '') + '">';
    h += '<div class="gwhen"><span class="dot"></span>'
       + (kicked ? 'Started — locked' : esc(fmtKick(iso))) + '</div>';
    h += '<div class="grow">';
    h += teamBtn(away, used, kicked, pickKicked);
    h += '<span class="at">@</span>';
    h += home ? teamBtn(home, used, kicked, pickKicked) : '';
    h += '</div></div>';
  }
  // No dead grey button pretending to be tappable. Nothing selected = nothing to press.
  if (sel){
    h += '<div class="submitbar"><button type="button" class="big" id="submitBtn">' +
      (db.myPick ? 'Change pick to ' : 'Lock in ') + esc(TEAM_NAMES[sel] || sel) + ' →</button></div>';
  } else if (db.myPick && !pickKicked){
    h += '<p class="pickhint">Tap another team to change your pick.</p>';
  }
  h += '<p class="muted legend">Crossed out = already used that team · Locked = game started</p></div>';
  return h;
}

function teamBtn(abbr, used, kicked, pickKicked){
  if (!abbr) return '';
  const isSel = sel === abbr;
  const isMine = db.myPick && db.myPick.team === abbr;
  let cls = 'team';
  if (isSel) cls += ' sel';
  if (used.has(abbr)) cls += ' used';
  else if (kicked || pickKicked) cls += ' locked';
  if (isMine) cls += ' mypick';
  const dis = used.has(abbr) || kicked || pickKicked;
  // The monument above already names the pick; in the row a checkmark is enough
  // and never squeezes the team name.
  const tag = isMine ? '✓' : '';
  const _c = TEAM_COLORS[abbr] || '#444';
  return '<button type="button" class="' + cls + '" style="--tc:' + _c + ';--tink:' + teamInk(_c) + '"'
    + ' data-team="' + esc(abbr) + '"'
    + (dis ? ' data-dis="1" aria-disabled="true"' : '') + (pickKicked ? ' data-pick-locked="1"' : '') + '>'
    + teamLogo(abbr)
    + '<span class="nm">' + esc(TEAM_NAMES[abbr] || abbr) + '</span>'
    + (tag ? '<span class="tag">' + tag + '</span>' : '')
    + '</button>';
}

function renderHistory(meState){
  const picks = meState.picks || {};
  const weeks = Object.keys(picks).map(Number).sort((a,b) => a - b);
  if (!weeks.length) return '';
  let h = '<div class="card"><h2>Your season</h2><div class="hist">';
  for (const w of weeks){
    const p = picks[w];
    h += '<span class="' + esc(p.outcome || '') + '">' + (p.team ? teamLogo(p.team) : '')
       + '<b>W' + w + '</b> ' + esc(TEAM_NAMES[p.team] || p.team || '—') + '</span>';
  }
  h += '</div></div>';
  return h;
}

function renderLeague(st){
  let h = '<div class="card"><h2>The league</h2>';
  if (st.pot){
    h += '<div class="potline"><span>Pot</span><b>' + money(st.pot.total) + '</b></div>' +
      '<div class="potline muted"><span>' + money(st.pot.entry) + ' entries + ' + money(st.pot.bb) + ' buybacks</span>' +
      '<span class="count">' + (st.aliveCount != null ? st.aliveCount + ' alive' : '') + '</span></div>';
  }
  if (st.recap) h += '<details style="margin:8px 0"><summary class="muted" style="cursor:pointer">Last week’s recap</summary><pre style="white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--dim)">' + esc(st.recap) + '</pre></details>';
  const rows = db.players.map(p => '<div class="standrow"><span>' + esc(p.name) + '</span><span class="st ' +
    (p.alive ? 'alive">ALIVE' : 'out">OUT' + (p.elim_week ? ' wk' + p.elim_week : '')) + '</span></div>').join('');
  h += '<details><summary class="muted" style="cursor:pointer">Everyone (' + db.players.length + ')</summary>' + rows + '</details>';
  h += '</div>';
  return h;
}

// ================= events =================
function wire(){
  document.querySelectorAll('.navbtn').forEach(b => b.onclick = async () => {
    view = b.dataset.view;
    if (view === 'board' && me.player && !DEMO){
      try{ await loadPickBoard(); }catch(err){ toast('Couldn’t refresh league picks: ' + (err.message || err)); }
    }
    render();
  });
  const signupForm = document.getElementById('signupForm');
  if (signupForm) signupForm.onsubmit = e => {
    e.preventDefault();
    submitSignupRequest(
      document.getElementById('signupName').value,
      document.getElementById('signupEmail').value,
      document.getElementById('signupPhone').value,
      document.getElementById('venmoSent').checked
    ).catch(err => {
      signupState.busy = false;
      const msg = String(err && err.message || '');
      signupState.message = /^(Enter|Confirm)/.test(msg)
        ? msg : 'Your entry could not be sent. Check your connection and try again, or text Noah.';
      render();
    });
  };
  const afterSignupMyPick = document.getElementById('afterSignupMyPick');
  if (afterSignupMyPick) afterSignupMyPick.onclick = () => { view = 'home'; render(); };
  const goMyPick = document.getElementById('goMyPick');
  if (goMyPick) goMyPick.onclick = () => { view = 'home'; render(); };
  const claimGoJoin = document.getElementById('claimGoJoin');
  if (claimGoJoin) claimGoJoin.onclick = (e) => { e.preventDefault(); view = 'join'; render(); };
  const boardRefresh = document.getElementById('boardRefresh');
  if (boardRefresh) boardRefresh.onclick = async () => {
    boardRefresh.disabled = true;
    try{ if (!DEMO) await loadPickBoard(); toast('League picks refreshed'); }
    catch(err){ toast('Couldn’t refresh league picks: ' + (err.message || err)); }
    render();
  };
  const boardSortEl = document.getElementById('boardSort');
  if (boardSortEl) boardSortEl.onchange = () => { boardSort = boardSortEl.value; render(); };
  const so = document.getElementById('signOutLink');
  if (so) so.onclick = e => {
    e.preventDefault();
    signOutPlayer().catch(err => toast('Couldn’t sign out: ' + (err.message || err)));
  };
  const emailForm = document.getElementById('emailLoginForm');
  if (emailForm) emailForm.onsubmit = e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    sendLoginCode(email).catch(err => {
      loginState.busy = false;
      loginState.message = /valid email/i.test(err.message || '') ? err.message
        : (/429|rate limit/i.test(err.message || '') ? 'Too many codes were requested. Wait a few minutes and try again.'
          : 'A code could not be sent. Confirm this is the roster email or ask Noah for help.');
      render();
    });
  };
  const codeForm = document.getElementById('codeLoginForm');
  if (codeForm) codeForm.onsubmit = e => {
    e.preventDefault();
    verifyLoginCode(document.getElementById('loginCode').value).catch(async err => {
      loginState.busy = false;
      loginState.message = /linked to an active pool account/i.test(err.message || '')
        ? err.message : 'That code is invalid or expired. Request a new one and try again.';
      if (/linked to an active pool account/i.test(err.message || '')){ try{ await sb.auth.signOut(); session = null; }catch(e2){} }
      render();
    });
  };
  const changeEmail = document.getElementById('changeEmailBtn');
  if (changeEmail) changeEmail.onclick = () => {
    loginState.sent = false; loginState.busy = false; loginState.message = '';
    sessionStorage.removeItem('survivor_login_email'); render();
  };
  const sw = document.getElementById('switchLink');
  if (sw) sw.onclick = e => {
    e.preventDefault();
    if (!confirm('Switch player? (Your claim stays yours — this just lets you look at the claim screen.)')) return;
    me.pid = null; me.player = null; localStorage.removeItem('survivor_pid');
    render();
  };
  const filter = document.getElementById('nameFilter');
  if (filter) filter.oninput = () => {
    const q = filter.value.toLowerCase();
    document.querySelectorAll('#nameList .namebtn').forEach(b => {
      b.style.display = b.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
    });
  };
  document.querySelectorAll('.namebtn').forEach(b => b.onclick = () => {
    if (b.dataset.taken){ toast('Already claimed on another phone — ask Noah to reset it if that’s you.'); return; }
    if (!confirm('Claim "' + b.textContent.replace(/claimed|out wk\d*/,'').trim() + '" as YOU on this phone?')) return;
    if (DEMO){ toast('Demo mode — claiming disabled'); return; }
    claim(b.dataset.pid).catch(err => toast('Claim failed: ' + (err.message || err)));
  });
  document.querySelectorAll('button.team').forEach(b => b.onclick = () => {
    if (b.dataset.dis){
      toast(b.classList.contains('used') ? 'You already used that team this season' :
        (b.dataset.pickLocked ? 'Your pick is locked because its game already started' : 'That game already kicked off'));
      return;
    }
    sel = (sel === b.dataset.team) ? null : b.dataset.team;
    render();
  });
  const sub = document.getElementById('submitBtn');
  if (sub) sub.onclick = () => {
    if (DEMO){ db.myPick = {team: sel}; me.player.used_teams; sel = null; render(); toast('✅ (demo) pick saved'); return; }
    submitPick().catch(async err => {
      try{ await loadAll(); }catch(e){}
      sel = null; render();
      toast('❌ Couldn’t save the pick: ' + (err.message || err));
    });
  };
}

// ================= boot =================
(async function(){
  try{
    if (DEMO){ loadDemo(); render(); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await loadBootstrap();
    await prepareSession();
    if (authMode === 'email_otp' && !session){ render(); }
    else await loadAll();
    render();
    sb.auth.onAuthStateChange((event, newSession) => {
      session = newSession;
      if (authMode === 'email_otp' && event === 'SIGNED_OUT'){
        me.pid = null; me.player = null; db.players = []; db.week = null; db.myPick = null;
        setTimeout(render, 0);
      }
    });
    // refresh data when the app comes back to foreground (phones)
    document.addEventListener('visibilitychange', async () => {
      if (!document.hidden && (authMode !== 'email_otp' || session)){ try{ await loadAll(); render(); }catch(e){} }
    });
    // Time passing does not emit a database event, so refresh the open board once
    // a minute to reveal games that have just kicked off.
    setInterval(async () => {
      if (view === 'board' && me.player && !document.hidden){
        try{ await loadPickBoard(); render(); }catch(e){}
      }
    }, 60000);
  }catch(err){
    // Don't blame the player's phone. "Failed to fetch" here almost always means
    // the backend is down (a paused free-tier project looks exactly like this),
    // and telling 70 people to check their connection routes 70 texts to Noah.
    const raw = String((err && err.message) || err || '');
    const backendDown = /failed to fetch|networkerror|load failed|err_name_not_resolved/i.test(raw);
    document.getElementById('app').innerHTML =
      '<div class="err"><b>' + (backendDown ? 'The league server isn’t responding.' : 'Couldn’t load the league.') + '</b><br>'
      + (backendDown
          ? 'This is on our end, not your phone — Noah has been having a look. Your pick and your entry are safe. Try again in a few minutes.'
          : esc(raw))
      + '</div>'
      + '<button type="button" class="big sec" id="bootRetry">Try again</button>'
      + '<p class="muted" style="margin-top:12px">Still stuck close to kickoff? Text Noah your pick — he can enter it by hand.</p>';
    const retry = document.getElementById('bootRetry');
    if (retry) retry.onclick = () => location.reload();
  }
})();
</script>
